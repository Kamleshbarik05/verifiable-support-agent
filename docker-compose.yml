services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: support_agent_pgvector
    environment:
      POSTGRES_DB: support_agent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/retrieval/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
