[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-support-agent"
version = "2.0.0"
description = "Trust-calibrated multi-agent customer support triage and resolution platform on Google Cloud"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Google Cloud Consulting Candidate" }
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "app/v1",
    ".git",
    "__pycache__",
    ".pytest_cache",
    "adk_agent",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort imports
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval", "adk_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
